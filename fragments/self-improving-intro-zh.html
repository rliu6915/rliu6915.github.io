      <p class="chapter-intro">Hermes 的「自我进化」很容易被误读。本篇先框定源码在做什么：模型<strong>不会</strong>在线改 agent 代码。经验通过 <code>skill_manage</code> 固化为可复用的 <strong>skill</strong>；事实经 <code>memory</code> 工具写入 <code>MEMORY.md</code> / <code>USER.md</code>，并由后台 nudge 唤起 review agent——再加上后加的 <strong>Curator</strong> 轮次，在磁盘上老化、可选合并 skill。</p>
