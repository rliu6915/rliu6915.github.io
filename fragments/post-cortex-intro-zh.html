      <p class="chapter-intro">Hermes 自带<strong>内置</strong>长期记忆——<code>MEMORY.md</code> 事实与 <code>SessionDB</code> FTS5 检索（见架构系列 <a class="inline" href="hermes-memory-zh.html">第 4 篇</a>）。<strong>post-cortex</strong> 是另一套社区记忆 <em>provider</em>：Hermes 插件 + 自托管 daemon，把<strong>类型化记录</strong>写入实体图并用<strong>本地语义检索</strong>召回。数据留在你可控的机器上（RocksDB 或 SurrealDB、本地 embedding）。本篇为独立深潜，不是四篇网关系列的「第 5 章」。</p>
