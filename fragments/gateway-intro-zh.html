      <p class="chapter-intro">聊天平台只提供 webhook 和发消息 API——不会替你管会话车道、配对或投递保证。<strong>平台适配器</strong>负责「接线」：校验回调、把各平台原始事件<strong>归一化</strong>成 <code>MessageEvent</code>，并在网关要求时把回复发回去。<strong>网关</strong>才是共用的 bot 层：<code>session_key</code>、鉴权、斜杠命令、忙碌时的排队与打断，以及用 delivery ledger 重试出站正文。Hermes <strong>CLI</strong> 不走网关，但跑的是同一个 <code>AIAgent</code> 轮次循环；接 Telegram、WhatsApp 等都要经过适配器 + <code>GatewayRunner</code>。没有这一层，每接一个平台就要自己重写会话路由、鉴权和投递。</p>
